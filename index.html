<style>
:root{--bg:#fafaf8;--txt:#16171c;--sec:#5d5f68;--borda:#dcdcd6;--real:#b8811a}

a:hover{border-color:var(--sec)}
a:focus-visible{outline:2px solid var(--real);outline-offset:2px}
a span{color:var(--sec);font-size:14px}
